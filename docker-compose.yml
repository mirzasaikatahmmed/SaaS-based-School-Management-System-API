services:
  postgres:
    image: postgres:16-alpine
    container_name: school_mgmt_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-schooladmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schoolpassword}
      POSTGRES_DB: ${POSTGRES_DB:-school_master}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - school_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schooladmin -d school_master"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: school_mgmt_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - school_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  api:
    image: mirzasaikatahmmed/saas-based-school-management-system-api:latest
    container_name: school_mgmt_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__MasterDb=Host=postgres;Port=5432;Database=school_master;Username=schooladmin;Password=schoolpassword
      - MinIO__Endpoint=minio:9000
      - MinIO__AccessKey=${MINIO_ROOT_USER:-minioadmin}
      - MinIO__SecretKey=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - JwtSettings__SecretKey=your-super-secret-key-minimum-32-characters-long
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - school_network

volumes:
  postgres_data:
  minio_data:

networks:
  school_network:
    driver: bridge
